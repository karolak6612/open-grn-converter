name: CI Release Build & Test

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Windows Release)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore vcpkg installed tree
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-installed-${{ runner.os }}-

      - name: Export GitHub Actions Cache Credentials for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure CMake (Release Preset)
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          cmake --preset release

      - name: Build Release Executables & Libraries
        shell: pwsh
        run: |
          cmake --build --preset release --config Release --parallel

      - name: Run Automated CTest Suite
        shell: pwsh
        run: |
          ctest --preset release --output-on-failure

      - name: Stage Release Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item "build/Release/grn_converter.exe" -Destination dist/
          if (Test-Path "build/Release/glfw3.dll") {
              Copy-Item "build/Release/glfw3.dll" -Destination dist/
          }
          Copy-Item "README.md" -Destination dist/
          Copy-Item "LICENSE" -Destination dist/
          
          # Create zip bundle for end users (AGENTS.md excluded)
          Compress-Archive -Path "dist/*" -DestinationPath "open-grn-converter-windows-x64.zip" -Force
          Move-Item -Path "open-grn-converter-windows-x64.zip" -Destination "dist/" -Force
          Get-ChildItem dist

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-grn-converter-windows-x64-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Publish Automated GitHub Release
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.repository_owner == 'karolak6612'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $isTag = "${{ github.ref }}" -like "refs/tags/*"
          $tag = if ($isTag) { "${{ github.ref_name }}" } else { "latest" }
          $title = if ($isTag) { "Release ${{ github.ref_name }}" } else { "open-grn-converter (Latest Build)" }
          
          @"
          Automated continuous release of **open-grn-converter** for Windows x64.
          
          - **Commit**: `${{ github.sha }}`
          - **Branch**: `${{ github.ref_name }}`
          
          ### Download:
          Download **open-grn-converter-windows-x64.zip** below, extract anywhere, and launch **grn_converter.exe** (no console shell spawned).
          "@ | Out-File -FilePath release_notes.md -Encoding utf8
          
          if (-not $isTag) {
              gh release delete latest --yes --cleanup-tag 2>$null || $true
          }
          
          gh release create $tag "dist/open-grn-converter-windows-x64.zip" "dist/grn_converter.exe" --title $title --notes-file release_notes.md --latest
