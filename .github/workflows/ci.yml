name: CI Release Build & Test

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build & Test (Windows Release)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Restore vcpkg installed tree
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-installed-${{ runner.os }}-

      - name: Export GitHub Actions Cache Credentials for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure CMake (Release Preset)
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
          QT_DIR: ${{ env.QT_ROOT_DIR }}
        run: |
          cmake --preset release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build Release Executables & Libraries
        shell: pwsh
        run: |
          cmake --build --preset release --config Release --parallel

      - name: Run Automated CTest Suite
        shell: pwsh
        run: |
          ctest --preset release --output-on-failure

      - name: Stage Release Package
        shell: pwsh
        run: |
          $dist = "dist"
          if (Test-Path $dist) { Remove-Item -Recurse -Force $dist }
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          
          # 1. Copy main executable
          Copy-Item "build/Release/grn_converter.exe" -Destination "$dist/" -Force
          
          # 2. Copy third-party runtime dependencies
          $runtimeDlls = @("meshoptimizer.dll", "D3Dcompiler_47.dll", "dxcompiler.dll", "dxil.dll")
          foreach ($dll in $runtimeDlls) {
              if (Test-Path "build/Release/$dll") {
                  Copy-Item "build/Release/$dll" -Destination "$dist/" -Force
              }
          }
          
          # 3. Locate windeployqt.exe and deploy Qt6 libraries
          $windeployqt = if (Test-Path "$env:QT_ROOT_DIR/bin/windeployqt.exe") {
              "$env:QT_ROOT_DIR/bin/windeployqt.exe"
          } elseif (Get-Command windeployqt -ErrorAction SilentlyContinue) {
              (Get-Command windeployqt).Source
          } else {
              $null
          }
          
          if ($windeployqt) {
              Write-Host "Running windeployqt: $windeployqt"
              & $windeployqt --no-compiler-runtime --no-opengl-sw --no-translations "$dist/grn_converter.exe"
          }
          
          # 4. Copy Qt6 DLLs and plugin directories
          Get-ChildItem "build/Release" -Filter "Qt6*.dll" -File -ErrorAction SilentlyContinue | ForEach-Object {
              if (-not (Test-Path "$dist/$($_.Name)")) {
                  Copy-Item $_.FullName -Destination "$dist/" -Force
              }
          }
          
          $pluginFolders = @("platforms", "styles", "imageformats", "iconengines", "tls", "generic", "networkinformation")
          foreach ($folder in $pluginFolders) {
              if ((Test-Path "build/Release/$folder") -and (-not (Test-Path "$dist/$folder"))) {
                  Copy-Item "build/Release/$folder" -Destination "$dist/" -Recurse -Force
              }
          }
          
          # 5. Clean intermediate/debug files
          Get-ChildItem -Path $dist -Filter "test_*.exe" -Recurse | Remove-Item -Force
          Get-ChildItem -Path $dist -Filter "*.pdb" -Recurse | Remove-Item -Force
          Get-ChildItem -Path $dist -Filter "*.ilk" -Recurse | Remove-Item -Force
          Get-ChildItem -Path $dist -Filter "*.exp" -Recurse | Remove-Item -Force
          Get-ChildItem -Path $dist -Filter "*.lib" -Recurse | Remove-Item -Force
          if (Test-Path "$dist/test_grn") {
              Remove-Item -Recurse -Force "$dist/test_grn"
          }
          
          # 6. Copy documentation and license
          Copy-Item "README.md" -Destination "$dist/" -Force
          Copy-Item "LICENSE" -Destination "$dist/" -Force
          
          # 7. Create compressed zip archive
          Compress-Archive -Path "$dist/*" -DestinationPath "open-grn-converter-windows-x64.zip" -Force
          Move-Item -Path "open-grn-converter-windows-x64.zip" -Destination "$dist/" -Force

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-grn-converter-windows-x64
          path: dist/open-grn-converter-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build & Test (Linux Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies & Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            qt6-base-dev \
            qt6-base-dev-tools \
            libqt6svg6-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxkbcommon-dev

      - name: Restore vcpkg installed tree
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-installed-${{ runner.os }}-

      - name: Export GitHub Actions Cache Credentials for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure CMake (Linux Release)
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          cmake --preset linux-release

      - name: Build Release Executables & Libraries
        run: |
          cmake --build --preset linux-release --parallel

      - name: Run Automated CTest Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --preset linux-release --output-on-failure

      - name: Stage Release Package
        run: |
          mkdir -p dist
          cp build/grn_converter dist/
          cp README.md dist/
          cp LICENSE dist/
          tar -czvf open-grn-converter-linux-x64.tar.gz -C dist grn_converter README.md LICENSE
          mv open-grn-converter-linux-x64.tar.gz dist/

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-grn-converter-linux-x64
          path: dist/open-grn-converter-linux-x64.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish Automated GitHub Release
    needs: [build-windows, build-linux]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.repository_owner == 'karolak6612'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: open-grn-converter-windows-x64
          path: release_assets/

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: open-grn-converter-linux-x64
          path: release_assets/

      - name: Publish Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          isTag="${{ startsWith(github.ref, 'refs/tags/') }}"
          tag="${{ github.ref_name }}"
          if [ "$isTag" != "true" ]; then
            tag="latest"
            title="open-grn-converter (Latest Build)"
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          else
            title="Release ${{ github.ref_name }}"
          fi

          cat << 'EOF' > release_notes.md
          Automated continuous release of **open-grn-converter**.

          - Commit: `${{ github.sha }}`
          - Branch: `${{ github.ref_name }}`

          ### Downloads:
          - Windows x64: `open-grn-converter-windows-x64.zip`
          - Linux x64: `open-grn-converter-linux-x64.tar.gz`
          EOF

          gh release create "$tag" \
            release_assets/open-grn-converter-windows-x64.zip \
            release_assets/open-grn-converter-linux-x64.tar.gz \
            --title "$title" \
            --notes-file release_notes.md \
            --latest
